[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meraki-db"
version = "0.1.0"
description = "Database extension for Meraki framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "mock"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meraki_db*"]
